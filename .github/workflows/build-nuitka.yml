name: Build Windows applications

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build applications and installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install project dependencies
        shell: pwsh
        run: uv sync --locked

      - name: Install Nuitka
        shell: pwsh
        run: uv pip install --python .venv\Scripts\python.exe Nuitka

      - name: Prepare runtime data directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path data | Out-Null

      - name: Compile teacher application
        shell: pwsh
        run: >-
          uv run --no-sync python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=disable
          --output-dir=dist\admin
          --include-data-dir=data=data
          for_admin.py

      - name: Compile teacher sync service
        shell: pwsh
        run: >-
          uv run --no-sync python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --windows-console-mode=disable
          --output-dir=dist\admin\for_admin.dist
          --include-data-dir=data=data
          --output-filename=main.exe
          main.py

      - name: Compile classroom application
        shell: pwsh
        run: >-
          uv run --no-sync python -m nuitka
          --standalone
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=disable
          --output-dir=dist\classroom
          --include-data-dir=data=data
          for_classroom_device.py

      - name: Compile uninstaller
        shell: pwsh
        run: >-
          uv run --no-sync python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=disable
          --output-dir=dist\uninstaller
          --output-filename=uninstall.exe
          uninstall.py

      - name: Add uninstallers to application packages
        shell: pwsh
        run: |
          Copy-Item dist\uninstaller\uninstall.exe dist\admin\for_admin.dist\uninstall.exe
          Copy-Item dist\uninstaller\uninstall.exe dist\classroom\for_classroom_device.dist\uninstall.exe

      - name: Create installer payload archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          Compress-Archive -Path dist\admin\for_admin.dist\* -DestinationPath payload\admin.zip -CompressionLevel Optimal
          Compress-Archive -Path dist\classroom\for_classroom_device.dist\* -DestinationPath payload\classroom.zip -CompressionLevel Optimal
          if ((Get-Item payload\admin.zip).Length -le 0 -or (Get-Item payload\classroom.zip).Length -le 0) { throw "Installer payload archive is empty" }

      - name: Compile installer
        shell: pwsh
        run: >-
          uv run --no-sync python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=disable
          --output-dir=dist\installer
          --output-filename=smart-cr-installer.exe
          --include-data-files=payload\admin.zip=payload\admin.zip
          --include-data-files=payload\classroom.zip=payload\classroom.zip
          installer.py

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-Item dist\installer\smart-cr-installer.exe
          if ($installer.Length -le 30000000) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }

      - name: Upload teacher artifact
        uses: actions/upload-artifact@v7
        with:
          name: smart-cr-admin
          path: dist\admin\for_admin.dist
          if-no-files-found: error

      - name: Upload classroom artifact
        uses: actions/upload-artifact@v7
        with:
          name: smart-cr-classroom-device
          path: dist\classroom\for_classroom_device.dist
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: smart-cr-installer
          path: dist\installer\smart-cr-installer.exe
          if-no-files-found: error